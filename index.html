<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Media Server</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #e50914; /* Netflix Red */
            margin-bottom: 30px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            background-color: #000;
        }
        .controls {
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #e50914;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #b81d24;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Private Theater</h1>
    
    <!-- Video Player -->
    <video controls preload="metadata">
        <!-- REPLACE THE URL BELOW WITH YOUR HUGGING FACE DIRECT LINK -->
        <source src="https://huggingface.co" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Download Button -->
    <div class="controls">
        <!-- REPLACE THE URL BELOW WITH YOUR HUGGING FACE DIRECT LINK -->
        <a href="https://huggingface.co" class="btn" download>Download Movie to Device</a>
    </div>
</div>

</body>
</html>
