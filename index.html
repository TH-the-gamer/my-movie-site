<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #e50914; /* Netflix Red */
            margin-bottom: 20px;
        }
        .player-section {
            background: #181818;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            max-height: 500px;
            background-color: #000;
            border-radius: 4px;
        }
        .controls {
            margin-top: 15px;
        }
        .btn {
            display: inline-block;
            background-color: #e50914;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #b81d24;
        }
        h2 {
            text-align: left;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #ccc;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-align: left;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #2a2a2a;
            border-color: #e50914;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .play-lbl {
            color: #e50914;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Private Library</h1>
    
    <!-- Main Player Section -->
    <div class="player-section">
        <h2 id="current-title">Select a movie below to watch</h2>
        <video id="video-player" controls preload="metadata"></video>
        <div class="controls">
            <a id="download-link" href="#" class="btn" download style="display: none;">Download This File</a>
        </div>
    </div>

    <!-- Media Library Grid -->
    <h2>All Media Files</h2>
    <div class="grid">
        
        <!-- MOVIE 1 -->
        <div class="card" onclick="playVideo('Abar Proloy 1', 'https://huggingface.co/datasets/OfficeTimeFunTime/OfficeTrial/resolve/ac6dba81d4800e85fbd7e0b8863cd1b28ef31b25/MovieLinkBD.com%20-%20Abar.Proloy.2023.720p.Bangla.AAC.WEB-DL.h264.mkv?download=true')">
            <h3>Abar Proloy 1</h3>
            <span class="play-lbl">▶ Watch / Download</span>
        </div>

        <!-- MOVIE 2 -->
        <div class="card" onclick="playVideo('Abar Proloy 2', 'https://huggingface.co/datasets/OfficeTimeFunTime/OfficeTrial/resolve/main/MovieLinkBD.com%20-%20Abar.Proloy.2026.720p.Bangla.AAC.WEB-DL.h264.mkv?download=true')">
            <h3>Abar Proloy 2</h3>
            <span class="play-lbl">▶ Watch / Download</span>
        </div>

        <!-- MOVIE 3 (Example: Add as many as you want like this)
        <div class="card" onclick="playVideo('Movie Title Three', 'https://huggingface.co/datasets/OfficeTimeFunTime/OfficeTrial/resolve/ac6dba81d4800e85fbd7e0b8863cd1b28ef31b25/MovieLinkBD.com%20-%20Abar.Proloy.2023.720p.Bangla.AAC.WEB-DL.h264.mkv?download=true')">
            <h3>Movie Title Three</h3>
            <span class="play-lbl">▶ Watch / Download</span>
        </div>
        -->

    </div>
</div>

<script>
    function playVideo(title, url) {
        const player = document.getElementById('video-player');
        const downloadLink = document.getElementById('download-link');
        const titleHeader = document.getElementById('current-title');

        // Set the new video source and title
        player.src = url;
        titleHeader.innerText = "Now Playing: " + title;
        
        // Update download button
        downloadLink.href = url;
        downloadLink.style.display = 'inline-block';

        // Auto play the video
        player.play();
        
        // Scroll smoothly to player on mobile devices
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
